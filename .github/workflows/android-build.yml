name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Export Android Debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    # The godot-ci image bakes its export templates, Android SDK, and a
    # ready-to-use debug keystore into /root. GitHub Actions normally points
    # HOME at a different directory for container jobs, which would hide all
    # of that from Godot -- pinning HOME back to /root is what makes the
    # export step below "just work" with no extra setup.
    env:
      HOME: /root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Godot project
        run: |
          godot --version
          test -f project.godot
          test -f export_presets.cfg
          grep -q 'name="Android"' export_presets.cfg

      # On a brand-new checkout there is no .godot/ cache yet, and Godot 4
      # does not resolve `class_name` scripts (InteriorBuilder, TouchControls)
      # until that cache has been built once. Skipping this step makes the
      # very next step fail with "Identifier ... not declared in the current
      # scope" for every class_name script, which aborts the export.
      - name: Import project (builds the script/class cache)
        run: godot --headless --path . --import

      - name: Create build directory
        run: mkdir -p build

      # Non-Gradle export (gradle_build/use_gradle_build=false) can't have its
      # target SDK overridden in export_presets.cfg -- Godot rejects that with
      # "Target SDK can only be overridden when Use Gradle Build is enabled."
      # So instead of changing the target, we widen what's available locally:
      # the image only ships build-tools;33.0.2, but Godot 4.3's precompiled
      # template targets SDK 34 (confirmed directly from its AndroidManifest
      # and from platform/android/export/export_plugin.cpp's
      # DEFAULT_TARGET_SDK_VERSION), so the export fails its configuration
      # check without a matching build-tools version available locally.
      - name: Install additional Android build-tools
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk \
            "build-tools;34.0.0" "platforms;android-34"

      - name: Export Android debug APK
        run: |
          godot --headless --verbose \
            --export-debug "Android" \
            "build/psp-open-world-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: psp-open-world-debug-apk
          path: build/psp-open-world-debug.apk
          if-no-files-found: error
