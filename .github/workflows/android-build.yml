name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Export Android Debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    env:
      HOME: /root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export environment
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"

          if [ -d "/root/.config/godot" ] && [ ! -d "$HOME/.config/godot" ]; then
            cp -a /root/.config/godot "$HOME/.config/"
          fi

          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            rm -rf "$HOME/.local/share/godot/export_templates/4.3.stable"
            cp -a /root/.local/share/godot/export_templates/4.3.stable               "$HOME/.local/share/godot/export_templates/"
          fi

      - name: Check Godot project
        run: |
          godot --version
          test -f project.godot
          test -f export_presets.cfg
          grep -q 'name="Android"' export_presets.cfg

      - name: Create build directory
        run: mkdir -p build

      - name: Export Android debug APK
        run: |
          godot --headless --verbose             --export-debug "Android"             "build/psp-open-world-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: psp-open-world-debug-apk
          path: build/psp-open-world-debug.apk
          if-no-files-found: error
