name: Build Android APK

# Runs on every push to main, and can also be triggered manually from the
# Actions tab (Run workflow button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Export debug APK
    runs-on: ubuntu-latest
    # This image bundles Godot 4.3 + export templates + Android build tools,
    # pre-configured under the image's /root home directory.
    container:
      image: barichello/godot-ci:4.3
    env:
      # GitHub Actions containers default HOME to /github/home, which hides
      # the export templates, Java/Android SDK paths, and editor settings
      # that this image already has set up under /root. Without this, export
      # fails with "No export template found" / "valid Java SDK path required"
      # even though the image has everything installed.
      HOME: /root

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create build output folder
        run: mkdir -v -p build

      - name: Export debug APK
        run: godot --headless --verbose --export-debug "Android" build/psp_game.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: psp-open-world-debug-apk
          path: build/psp_game.apk
