name: Build Godot Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: firebelley/godot-android-build@v2.1.0
        with:
          godot-version: 4.3.0
          project-path: .
          export-configuration: Android
          use-preset: true
